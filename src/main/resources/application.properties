spring.application.name=BankCashWithdrawalApp
spring.datasource.url=${DATABASE_URL:jdbc:h2:mem:bankcashwithdrawal;DB_CLOSE_DELAY=-1}
spring.datasource.username=${DATABASE_USERNAME:sa}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.sql.init.mode=${SQL_INIT_MODE:always}
spring.jpa.hibernate.ddl-auto=none

app.aws.region=${AWS_REGION:af-south-1}
app.aws.sns.topic-arn=${AWS_SNS_TOPIC_ARN:}
app.outbox.enabled=${OUTBOX_ENABLED:true}
app.outbox.poll-interval-ms=${OUTBOX_POLL_INTERVAL_MS:1000}
app.outbox.batch-size=${OUTBOX_BATCH_SIZE:10}
app.outbox.lease-seconds=${OUTBOX_LEASE_SECONDS:60}
