spring.application.name=BankCashWithdrawalApp
spring.datasource.url=${DATABASE_URL:jdbc:h2:mem:bankcashwithdrawal;DB_CLOSE_DELAY=-1}
spring.datasource.username=${DATABASE_USERNAME:sa}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.sql.init.mode=${SQL_INIT_MODE:always}
spring.jpa.hibernate.ddl-auto=none
logging.level.org.example.bankcashwithdrawalapp=${APP_LOG_LEVEL:INFO}
logging.pattern.console=%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%thread] [%X{requestId}] %logger{36} - %msg%n
management.endpoints.web.exposure.include=${MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE:health,info}
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
management.info.env.enabled=true
info.app.name=${spring.application.name}
info.app.description=Transactional bank account withdrawal API

app.aws.region=${AWS_REGION:af-south-1}
app.aws.sns.topic-arn=${AWS_SNS_TOPIC_ARN:}
app.outbox.enabled=${OUTBOX_ENABLED:true}
app.outbox.poll-interval-ms=${OUTBOX_POLL_INTERVAL_MS:1000}
app.outbox.batch-size=${OUTBOX_BATCH_SIZE:10}
app.outbox.lease-seconds=${OUTBOX_LEASE_SECONDS:60}
